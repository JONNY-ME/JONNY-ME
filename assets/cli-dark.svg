<svg xmlns="http://www.w3.org/2000/svg" width="840" height="220" viewBox="0 0 840 220" role="img" aria-labelledby="title desc">
<title id="title">Capture 004: a zindi-cli session</title><desc id="desc">Illustrative console capture. Each zindi-cli command returns one JSON document; an expired login returns a typed error on stderr and exits with code 3.</desc>
<style>
text {font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;}
</style>
<rect x="0.5" y="0.5" width="839" height="219" rx="10" fill="#212722" stroke="#3A453C" stroke-width="1"/>
<text x="26" y="20" fill="#F3F0E7" font-size="11" letter-spacing="1.4" font-weight="700">YM-01</text>
<text x="76" y="20" fill="#A4AD9E" font-size="9.5" letter-spacing="1.2">CAPTURE 004 · CONSOLE</text>
<text x="814" y="20" fill="#A4AD9E" font-size="9" text-anchor="end" letter-spacing="1.2">ILLUSTRATIVE SESSION</text>
<rect x="12" y="30" width="816" height="156" rx="4" fill="#141915" stroke="#3A453C" stroke-width="1"/>
<text x="28" y="47" fill="#A3C89E" font-size="10" font-weight="700">$</text>
<text x="40" y="47" fill="#F3F0E7" font-size="10">zindi use my-challenge</text>
<text x="40" y="61.5" fill="#A4AD9E" font-size="10">{&quot;ok&quot;: true, …}</text>
<circle cx="676" cy="58" r="2.2" fill="#E3B866"/>
<text x="686" y="61.5" fill="#A4AD9E" font-size="9.5">0</text>
<text x="744" y="61.5" fill="#A4AD9E" font-size="9.5">stdout</text>
<text x="28" y="76" fill="#A3C89E" font-size="10" font-weight="700">$</text>
<text x="40" y="76" fill="#F3F0E7" font-size="10">zindi data download --output data/</text>
<text x="40" y="90.5" fill="#A4AD9E" font-size="10">{&quot;ok&quot;: true, …}</text>
<circle cx="676" cy="87" r="2.2" fill="#E3B866"/>
<text x="686" y="90.5" fill="#A4AD9E" font-size="9.5">0</text>
<text x="744" y="90.5" fill="#A4AD9E" font-size="9.5">stdout</text>
<text x="28" y="105" fill="#A3C89E" font-size="10" font-weight="700">$</text>
<text x="40" y="105" fill="#F3F0E7" font-size="10">zindi submissions submit sub.csv --comment &quot;baseline&quot;</text>
<text x="40" y="119.5" fill="#A4AD9E" font-size="10">{&quot;ok&quot;: true, &quot;command&quot;: &quot;submissions.submit&quot;, &quot;data&quot;: {&quot;status&quot;: &quot;initial&quot;, …}}</text>
<circle cx="676" cy="116" r="2.2" fill="#E3B866"/>
<text x="686" y="119.5" fill="#A4AD9E" font-size="9.5">0</text>
<text x="744" y="119.5" fill="#A4AD9E" font-size="9.5">stdout</text>
<text x="28" y="134" fill="#A3C89E" font-size="10" font-weight="700">$</text>
<text x="40" y="134" fill="#F3F0E7" font-size="10">zindi leaderboard --mine</text>
<text x="40" y="148.5" fill="#E89A7F" font-size="10">{&quot;ok&quot;: false, &quot;error&quot;: {&quot;code&quot;: &quot;AUTH_EXPIRED&quot;, &quot;message&quot;: &quot;Run: zindi auth login&quot;, …}}</text>
<circle cx="706" cy="145" r="2.2" fill="#E3B866"/>
<text x="716" y="148.5" fill="#E89A7F" font-size="9.5" font-weight="700">3</text>
<text x="744" y="148.5" fill="#E89A7F" font-size="9.5">stderr</text>
<text x="28" y="163" fill="#A3C89E" font-size="10" font-weight="700">$</text>
<text x="40" y="163" fill="#F3F0E7" font-size="10">zindi auth login _</text>
<path d="M650 34V182" fill="none" stroke="#3A463D" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="666" y="47" fill="#E3B866" font-size="9.5" letter-spacing="1" font-weight="700">EXIT</text>
<text x="744" y="47" fill="#A4AD9E" font-size="9" letter-spacing="1">STREAM</text>
<path d="M676 54V139.5H706V163" fill="none" stroke="#E3B866" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="miter"/>
<text x="26" y="207" fill="#E89A7F" font-size="9.5" letter-spacing="1.2" font-weight="700">EXIT 3</text>
<text x="76.6" y="207" fill="#F3F0E7" font-size="10">= AUTH_REQUIRED | AUTH_EXPIRED</text>
<text x="814" y="207" fill="#A4AD9E" font-size="9.5" text-anchor="end" letter-spacing="1">one JSON document per command</text>
</svg>
