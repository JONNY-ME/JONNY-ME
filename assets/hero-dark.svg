<title id="title">YM-01 Bench, capture 001: Yohannes Melese</title><desc id="desc">A logic-analyzer capture. A UART signal (9600 baud, 8N1) decodes byte by byte into YOHANNES, above learning, software, and hardware channels. A conceptual illustration of interdisciplinary engineering.</desc>
