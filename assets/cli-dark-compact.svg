<svg xmlns="http://www.w3.org/2000/svg" width="360" height="188" viewBox="0 0 360 188" role="img" aria-labelledby="title desc">
<title id="title">Capture 004: a zindi-cli session</title><desc id="desc">Illustrative console capture. Each zindi-cli command returns one JSON document; an expired login returns a typed error on stderr and exits with code 3.</desc>
<style>
text {font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;}
</style>
<rect x="0.5" y="0.5" width="359" height="187" rx="10" fill="#212722" stroke="#3A453C" stroke-width="1"/>
<text x="18" y="19" fill="#F3F0E7" font-size="11" letter-spacing="1.4" font-weight="700">YM-01</text>
<text x="68" y="19" fill="#A4AD9E" font-size="9.5" letter-spacing="1.2">004 · CONSOLE</text>
<text x="342" y="19" fill="#A4AD9E" font-size="9" text-anchor="end" letter-spacing="1.2">ILLUSTRATIVE</text>
<rect x="8" y="28" width="344" height="128" rx="4" fill="#141915" stroke="#3A453C" stroke-width="1"/>
<text x="18" y="58" fill="#A3C89E" font-size="9.5" font-weight="700">$</text>
<text x="28" y="58" fill="#F3F0E7" font-size="9.5">zindi use my-challenge</text>
<text x="18" y="72" fill="#A3C89E" font-size="9.5" font-weight="700">$</text>
<text x="28" y="72" fill="#F3F0E7" font-size="9.5">zindi data download --output data/</text>
<text x="18" y="86" fill="#A3C89E" font-size="9.5" font-weight="700">$</text>
<text x="28" y="86" fill="#F3F0E7" font-size="9.5">zindi submissions submit sub.csv</text>
<text x="18" y="100" fill="#A4AD9E" font-size="9.5">{&quot;ok&quot;: true, &quot;command&quot;: &quot;submissions.submit&quot;, …}</text>
<text x="342" y="100" fill="#A4AD9E" font-size="9.5" text-anchor="end">0</text>
<text x="18" y="114" fill="#A3C89E" font-size="9.5" font-weight="700">$</text>
<text x="28" y="114" fill="#F3F0E7" font-size="9.5">zindi leaderboard --mine</text>
<text x="18" y="128" fill="#E89A7F" font-size="9.5">{&quot;ok&quot;: false, &quot;error&quot;: {&quot;code&quot;: &quot;AUTH_EXPIRED&quot;, …}}</text>
<text x="342" y="128" fill="#E89A7F" font-size="9.5" text-anchor="end" font-weight="700">3</text>
<text x="18" y="142" fill="#A3C89E" font-size="9.5" font-weight="700">$</text>
<text x="28" y="142" fill="#F3F0E7" font-size="9.5">zindi auth login _</text>
<text x="342" y="44" fill="#E3B866" font-size="8" text-anchor="end" letter-spacing="1" font-weight="700">EXIT</text>
<text x="18" y="174" fill="#E89A7F" font-size="9.5" letter-spacing="1.2" font-weight="700">EXIT 3</text>
<text x="67.4" y="174" fill="#F3F0E7" font-size="9.5">= AUTH_REQUIRED | AUTH_EXPIRED</text>
</svg>
