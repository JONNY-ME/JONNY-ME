name: Check profile

on:
  push:
    paths:
      - 'profile.json'
      - 'templates/**'
      - 'scripts/**'
      - 'tests/**'
      - 'assets/**'
      - 'data/github.json'
      - 'README.md'
      - '.github/workflows/**'
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/build.py --check
  public-data:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify public data access without publishing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_activity.py --dry-run
