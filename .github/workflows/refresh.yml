name: Refresh Jonny GitHub profile

on:
  schedule:
    - cron: '17 6 * * *' # 09:17 Africa/Addis_Ababa (UTC+3)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-workbench-refresh
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'JONNY-ME/JONNY-ME' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate existing generation
        run: python3 scripts/build.py --check
      - name: Fetch public metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_activity.py
      - name: Render and test
        run: |
          python3 scripts/build.py
          python3 -m unittest discover -s tests -v
          python3 scripts/build.py --check
      - name: Commit substantive updates
        run: |
          if git diff --quiet -- README.md data/github.json 'assets/*.svg'; then
            echo 'No GitHub snapshot changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md data/github.json assets/*.svg
          git commit -m 'Refresh Jonny GitHub snapshot'
          git push
